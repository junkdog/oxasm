[workspace]
resolver = "3"
# The fuzz targets are their own workspace, built by cargo-fuzz with nightly.
exclude = ["fuzz"]
members = [
    "crates/oxasm",
    "crates/oxasm-tree",
    "crates/oxasm-analysis",
    "crates/oxasm-commons",
    "crates/oxasm-util",
    "crates/oxasm-testkit",
    "crates/oxasm-bench",
    "xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "BSD-3-Clause"

[workspace.dependencies]
oxasm = { path = "crates/oxasm" }
oxasm-tree = { path = "crates/oxasm-tree" }
oxasm-analysis = { path = "crates/oxasm-analysis" }
oxasm-commons = { path = "crates/oxasm-commons" }
oxasm-util = { path = "crates/oxasm-util" }
oxasm-testkit = { path = "crates/oxasm-testkit" }
oxasm-bench = { path = "crates/oxasm-bench" }

bitflags = "2.13.2"
dyn-clone = "1.0.20"
rustc-hash = "2.1.3"
sha1 = "0.11"
thiserror = "2.0.21"

# dev only
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.11.0"

# xtask only
anyhow = "1"
sha2 = "0.11"
zip = { version = "8", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# ADR-18: every unsafe block states its invariant; one unsafe op per block.
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "warn"
# ADR-17: Java's narrowing casts are the spec in ported modules, which opt out with a
# module-level `#![allow(clippy::cast_possible_truncation)]`; new code must not truncate silently.
cast_possible_truncation = "deny"

[profile.dev.package."*"]
opt-level = 1

# `cargo xtask`: the parity sweeps run oxasm over whole corpus tiers, ~4× faster optimized; debug
# assertions and overflow checks stay on, as in dev.
[profile.xtask]
inherits = "dev"
opt-level = 2

name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # T0 goldens are committed, so this needs no Java.
      - run: cargo test --workspace
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: msrv (1.96)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  oracle:
    name: oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/ow2/asm
          key: asm-jars-${{ hashFiles('xtask/src/pin.rs') }}
      # The pinned ASM jars come from Maven Central through `mvn dependency:get`; xtask checks
      # their SHA-256 against xtask/src/pin.rs.
      - name: goldens match a fresh oracle run (and ASM's own Textifier goldens)
        run: cargo xtask golden --check
      - name: oracle sweep over T0 and a T1 sample
        run: |
          cargo xtask corpus t1
          cargo xtask parity --tier t0 --oracle-only
          cargo xtask parity --tier t1 --sample 2000 --oracle-only

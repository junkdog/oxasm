name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # T0 goldens are committed, so this needs no Java.
      - run: cargo test --workspace
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: msrv (1.99)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  miri:
    # ADR-18: every module containing `unsafe` runs its tests under Miri. Today that is jstr.
    name: miri (unsafe modules)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ""
      # proptest persists failures (getcwd), and the full case counts are slow under Miri.
      MIRIFLAGS: -Zmiri-disable-isolation
      PROPTEST_CASES: "16"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - run: cargo miri setup
      - run: cargo miri test -p oxasm --lib jstr

  oracle:
    name: oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/ow2/asm
          key: asm-jars-${{ hashFiles('xtask/src/pin.rs') }}
      # The pinned ASM jars come from Maven Central through `mvn dependency:get`; xtask checks
      # their SHA-256 against xtask/src/pin.rs.
      - name: goldens match a fresh oracle run (and ASM's own Textifier goldens)
        run: cargo xtask golden --check
      - name: oracle sweep over T0 and a T1 sample
        run: |
          cargo xtask corpus t1
          cargo xtask parity --tier t0 --oracle-only
          cargo xtask parity --tier t1 --sample 2000 --oracle-only
      # Textifier parity: oxasm's reader + Textifier against ASM's, with every reader option, directly
      # (P2) and through a ClassNode (P3).
      - name: Textifier parity over T0 and a T1 sample
        run: |
          cargo xtask parity --tier t0
          cargo xtask parity --tier t1 --sample 2000

  fuzz-smoke:
    name: fuzz smoke (60 s per target)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ""
    strategy:
      fail-fast: false
      matrix:
        target: [read_noop, read_textify, read_tree, tree_ops]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      # Seeds: the T0 corpus (valid and invalid classes) and the regression inputs (tree_ops reads
      # them as edit scripts).
      - name: seed corpus
        run: |
          mkdir -p fuzz/corpus/${{ matrix.target }}
          find corpus/t0 fuzz/regressions -type f \( -name '*.class' -o -name '*.clazz' -o -path '*/regressions/*' \) \
            -exec sh -c 'cp "$1" "fuzz/corpus/${{ matrix.target }}/$(sha1sum "$1" | cut -c1-16)"' _ {} \;
      # A reduced stack surfaces unbounded recursion (ADR-06); debug assertions catch overflows.
      - run: |
          ulimit -s 2048
          cd fuzz && cargo fuzz run -O -a ${{ matrix.target }} -- -max_total_time=60 -max_len=200000 -rss_limit_mb=2048
